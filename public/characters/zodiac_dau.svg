<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="dauHead" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <ellipse cx="64" cy="116" rx="38" ry="7" fill="rgba(45,26,17,0.25)"/>
  <!-- Red Comb -->
  <circle cx="54" cy="24" r="8" fill="#ef4444"/>
  <circle cx="64" cy="18" r="9.5" fill="#dc2626" filter="url(#shadow)"/>
  <circle cx="74" cy="24" r="8" fill="#b91c1c"/>
  <!-- Winglets -->
  <ellipse cx="26" cy="72" rx="10" ry="16" transform="rotate(20 26 72)" fill="#eab308"/>
  <ellipse cx="102" cy="72" rx="10" ry="16" transform="rotate(-20 102 72)" fill="#ca8a04"/>
  <!-- Round Head -->
  <circle cx="64" cy="66" r="38" fill="url(#dauHead)" filter="url(#shadow)"/>
  <!-- 3D Specular Highlight -->
  <ellipse cx="50" cy="44" rx="16" ry="8" transform="rotate(-25 50 44)" fill="rgba(255,255,255,0.3)"/>
  <!-- Big Curious Anime Eyes -->
  <ellipse cx="46" cy="62" rx="7.5" ry="9.5" fill="#1e1e1e"/>
  <ellipse cx="82" cy="62" rx="7.5" ry="9.5" fill="#1e1e1e"/>
  <circle cx="43" cy="58" r="3.2" fill="#ffffff"/>
  <circle cx="48" cy="66" r="1.3" fill="#ffffff"/>
  <circle cx="79" cy="58" r="3.2" fill="#ffffff"/>
  <circle cx="84" cy="66" r="1.3" fill="#ffffff"/>
  <!-- Pink Blush -->
  <circle cx="34" cy="74" r="5.5" fill="#fb7185" opacity="0.5"/>
  <circle cx="94" cy="74" r="5.5" fill="#fb7185" opacity="0.5"/>
  <!-- Orange Beak -->
  <polygon points="64,80 56,70 72,70" fill="#f97316" filter="url(#shadow)"/>
  <!-- Red Wattle under beak -->
  <circle cx="64" cy="85" r="4.5" fill="#ef4444"/>
</svg>