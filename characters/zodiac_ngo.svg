<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="ngoHead" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="65%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="ngoMane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <ellipse cx="64" cy="116" rx="38" ry="7" fill="rgba(45,26,17,0.25)"/>
  <!-- Ears -->
  <polygon points="32,46 36,18 50,40" fill="#92400e"/>
  <polygon points="35,42 38,24 47,38" fill="#fbcfe8"/>
  <polygon points="96,46 92,18 78,40" fill="#78350f"/>
  <polygon points="93,42 90,24 81,38" fill="#fbcfe8"/>
  <!-- Golden Mane behind -->
  <path d="M 64 16 C 42 16, 38 40, 48 50 C 40 30, 52 24, 64 16 Z" fill="url(#ngoMane)"/>
  <!-- Head -->
  <circle cx="64" cy="64" r="38" fill="url(#ngoHead)" filter="url(#shadow)"/>
  <!-- Mane Tuft on forehead -->
  <path d="M 52 28 Q 64 18 76 28 Q 70 36 64 32 Q 58 36 52 28 Z" fill="url(#ngoMane)" filter="url(#shadow)"/>
  <!-- White Star Diamond on Forehead -->
  <polygon points="64,36 68,43 64,50 60,43" fill="#ffffff"/>
  <!-- Eyes -->
  <ellipse cx="46" cy="58" rx="7" ry="9" fill="#1e1e1e"/>
  <ellipse cx="82" cy="58" rx="7" ry="9" fill="#1e1e1e"/>
  <circle cx="43" cy="54" r="3.2" fill="#ffffff"/>
  <circle cx="48" cy="62" r="1.3" fill="#ffffff"/>
  <circle cx="79" cy="54" r="3.2" fill="#ffffff"/>
  <circle cx="84" cy="62" r="1.3" fill="#ffffff"/>
  <!-- White Muzzle -->
  <ellipse cx="64" cy="82" rx="20" ry="14" fill="#fef3c7" filter="url(#shadow)"/>
  <ellipse cx="56" cy="80" rx="3" ry="4" fill="#78350f"/>
  <ellipse cx="72" cy="80" rx="3" ry="4" fill="#78350f"/>
  <path d="M 60 88 Q 64 92 68 88" stroke="#78350f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>