<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="thanHead" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="65%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#713f12"/>
    </radialGradient>
    <radialGradient id="thanFace" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="80%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <ellipse cx="64" cy="116" rx="38" ry="7" fill="rgba(45,26,17,0.25)"/>
  <!-- Round Ears -->
  <circle cx="24" cy="60" r="16" fill="#854d0e" filter="url(#shadow)"/>
  <circle cx="24" cy="60" r="10" fill="#fed7aa"/>
  <circle cx="104" cy="60" r="16" fill="#713f12" filter="url(#shadow)"/>
  <circle cx="104" cy="60" r="10" fill="#fed7aa"/>
  <!-- Head -->
  <circle cx="64" cy="62" r="38" fill="url(#thanHead)" filter="url(#shadow)"/>
  <!-- Heart-Shaped Face Mask -->
  <ellipse cx="50" cy="58" rx="18" ry="20" fill="url(#thanFace)"/>
  <ellipse cx="78" cy="58" rx="18" ry="20" fill="url(#thanFace)"/>
  <ellipse cx="64" cy="74" rx="22" ry="16" fill="url(#thanFace)"/>
  <!-- Eyes -->
  <ellipse cx="48" cy="56" rx="6.5" ry="8.5" fill="#1e1e1e"/>
  <ellipse cx="80" cy="56" rx="6.5" ry="8.5" fill="#1e1e1e"/>
  <circle cx="45" cy="52" r="3" fill="#ffffff"/>
  <circle cx="50" cy="60" r="1.2" fill="#ffffff"/>
  <circle cx="77" cy="52" r="3" fill="#ffffff"/>
  <circle cx="82" cy="60" r="1.2" fill="#ffffff"/>
  <!-- Pink Cheeks -->
  <circle cx="38" cy="70" r="5" fill="#f43f5e" opacity="0.45"/>
  <circle cx="90" cy="70" r="5" fill="#f43f5e" opacity="0.45"/>
  <!-- Nose & Big Grin -->
  <ellipse cx="64" cy="68" rx="3" ry="2" fill="#713f12"/>
  <path d="M 52 74 Q 64 86 76 74" stroke="#713f12" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Little Banana on Head -->
  <path d="M 56 22 Q 68 18 78 26 Q 68 22 56 22 Z" fill="#facc15"/>
</svg>