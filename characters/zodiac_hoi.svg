<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="hoiHead" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="60%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </radialGradient>
    <radialGradient id="hoiSnout" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <ellipse cx="64" cy="116" rx="38" ry="7" fill="rgba(45,26,17,0.25)"/>
  <!-- Floppy Piggy Ears -->
  <ellipse cx="30" cy="42" rx="14" ry="9" transform="rotate(-30 30 42)" fill="#f472b6" filter="url(#shadow)"/>
  <ellipse cx="30" cy="42" rx="9" ry="5" transform="rotate(-30 30 42)" fill="#db2777"/>
  <ellipse cx="98" cy="42" rx="14" ry="9" transform="rotate(30 98 42)" fill="#ec4899" filter="url(#shadow)"/>
  <ellipse cx="98" cy="42" rx="9" ry="5" transform="rotate(30 98 42)" fill="#db2777"/>
  <!-- Head -->
  <circle cx="64" cy="66" r="39" fill="url(#hoiHead)" filter="url(#shadow)"/>
  <!-- 3D Specular Highlight -->
  <ellipse cx="48" cy="42" rx="18" ry="9" transform="rotate(-25 48 42)" fill="rgba(255,255,255,0.35)"/>
  <!-- Cute Happy Eyes -->
  <path d="M 40 58 Q 46 50 52 58" stroke="#1e1e1e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 76 58 Q 82 50 88 58" stroke="#1e1e1e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Blush -->
  <circle cx="34" cy="70" r="6" fill="#f43f5e" opacity="0.55"/>
  <circle cx="94" cy="70" r="6" fill="#f43f5e" opacity="0.55"/>
  <!-- Iconic Oval 3D Snout -->
  <ellipse cx="64" cy="76" rx="18" ry="13" fill="url(#hoiSnout)" filter="url(#shadow)"/>
  <ellipse cx="58" cy="76" rx="3.5" ry="5" fill="#831843"/>
  <ellipse cx="70" cy="76" rx="3.5" ry="5" fill="#831843"/>
  <!-- Happy Smile under Snout -->
  <path d="M 58 92 Q 64 97 70 92" stroke="#831843" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Lucky Clover over Ear -->
  <circle cx="86" cy="30" r="3.5" fill="#22c55e"/>
  <circle cx="92" cy="27" r="3.5" fill="#22c55e"/>
  <circle cx="94" cy="33" r="3.5" fill="#22c55e"/>
</svg>