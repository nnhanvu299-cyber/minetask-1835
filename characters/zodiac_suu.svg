<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="suuHead" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="55%" stop-color="#5d4037"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </radialGradient>
    <linearGradient id="suuHornL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="suuHornR" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <radialGradient id="suuSnout" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="80%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Drop Shadow -->
  <ellipse cx="64" cy="116" rx="38" ry="7" fill="rgba(45,26,17,0.25)"/>
  <!-- Horns -->
  <path d="M 38 48 C 18 42, 10 24, 20 16 C 28 10, 36 28, 44 40 Z" fill="url(#suuHornL)" filter="url(#shadow)"/>
  <path d="M 90 48 C 110 42, 118 24, 108 16 C 100 10, 92 28, 84 40 Z" fill="url(#suuHornR)" filter="url(#shadow)"/>
  <!-- Ears -->
  <ellipse cx="26" cy="56" rx="12" ry="7" transform="rotate(-20 26 56)" fill="#5d4037"/>
  <ellipse cx="26" cy="56" rx="8" ry="4" transform="rotate(-20 26 56)" fill="#f472b6"/>
  <ellipse cx="102" cy="56" rx="12" ry="7" transform="rotate(20 102 56)" fill="#4e342e"/>
  <ellipse cx="102" cy="56" rx="8" ry="4" transform="rotate(20 102 56)" fill="#f472b6"/>
  <!-- Head -->
  <circle cx="64" cy="62" r="38" fill="url(#suuHead)" filter="url(#shadow)"/>
  <!-- 3D Highlight Top-Left -->
  <ellipse cx="50" cy="40" rx="16" ry="8" transform="rotate(-25 50 40)" fill="rgba(255,255,255,0.18)"/>
  <!-- Cute Tuft Hair -->
  <path d="M 58 26 Q 64 20 70 26 Q 64 22 58 26 Z" fill="#3e2723"/>
  <!-- Eyes -->
  <ellipse cx="48" cy="56" rx="6" ry="8" fill="#1e1e1e"/>
  <ellipse cx="80" cy="56" rx="6" ry="8" fill="#1e1e1e"/>
  <circle cx="46" cy="53" r="2.8" fill="#ffffff"/>
  <circle cx="50" cy="59" r="1.2" fill="#ffffff"/>
  <circle cx="78" cy="53" r="2.8" fill="#ffffff"/>
  <circle cx="82" cy="59" r="1.2" fill="#ffffff"/>
  <!-- Rosy Cheeks -->
  <circle cx="36" cy="68" r="6" fill="#f43f5e" opacity="0.4"/>
  <circle cx="92" cy="68" r="6" fill="#f43f5e" opacity="0.4"/>
  <!-- 3D Snout -->
  <ellipse cx="64" cy="78" rx="22" ry="15" fill="url(#suuSnout)" filter="url(#shadow)"/>
  <!-- Nostrils -->
  <ellipse cx="56" cy="78" rx="3.5" ry="5" fill="#831843"/>
  <ellipse cx="72" cy="78" rx="3.5" ry="5" fill="#831843"/>
  <!-- Cute Gold Ring -->
  <circle cx="64" cy="88" r="6" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
</svg>