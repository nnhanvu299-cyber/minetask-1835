  <body class="pixel-antialiased bg-[#FDF7E7] text-[#2D1A11]">
    <div id="root"></div>
    <script>
      // Global anti-autofill enforcer for Android / iOS mobile keyboards (Hides 🔑 Key, 💳 Card, 📍 Pin toolbar)
      (function() {
        function sanitizeInput(el) {
          if (!el || !el.tagName) return;
          var tag = el.tagName.toLowerCase();
          if (tag === 'input' || tag === 'textarea') {
            var type = (el.getAttribute('type') || 'text').toLowerCase();
            if (type !== 'file' && type !== 'checkbox' && type !== 'radio' && type !== 'range') {
              el.setAttribute('autocomplete', 'off');
              el.setAttribute('autocapitalize', 'sentences');
              el.setAttribute('autocorrect', 'off');
              el.setAttribute('spellcheck', 'false');
              el.setAttribute('data-form-type', 'other');
              el.setAttribute('data-lpignore', 'true');
              el.setAttribute('data-1p-ignore', 'true');
              el.setAttribute('data-android-autofill', 'false');
            }
          }
        }

        document.addEventListener('focusin', function(e) {
          sanitizeInput(e.target);
        }, true);

        document.addEventListener('pointerdown', function(e) {
          sanitizeInput(e.target);
        }, true);
      })();

      // Service worker management: Unregister on localhost to avoid stale caching during development
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let reg of registrations) {
              reg.unregister();
              console.log('[Dev] Unregistered stale SW:', reg.scope);
            }
          });
          if ('caches' in window) {
            caches.keys().then((names) => {
              names.forEach((name) => caches.delete(name));
            });
          }
        } else {
          // Production / PWA mode
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((reg) => {
              reg.update();
              setInterval(() => reg.update(), 60000);

              // Gỡ bỏ periodicSync cũ để tránh tự động bắn thông báo cập nhật ngầm liên tục
              if ('periodicSync' in reg) {
                try {
                  reg.periodicSync.getTags().then((tags) => {
                    tags.forEach((tag) => {
                      if (tag === 'minetask-check-update' || tag === 'check-updates') {
                        reg.periodicSync.unregister(tag).catch(() => {});
                      }
                    });
                  }).catch(() => {});
                } catch (e) {}
              }

              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });
            }).catch((err) => console.warn('[1835 PWA] Registration failed:', err));
          });

          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        }
      }
    </script>
